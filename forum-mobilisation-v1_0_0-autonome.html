<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forums-Mobilisation (édition autonome)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/*
 * Forums-Mobilisation – Feuille de style
 * © 2026 – Conçu et développé par Nicolas Gallien
 * Version 1.0.0 – 2026-09-30
 */
:root{
  --paper:#F3F6FB; --surface:#FFFFFF; --ink:#15223D; --muted:#56627A;
  --line:#D3DBE8; --rule:#E4E9F2; --blue:#2446A8; --blue-ink:#FFFFFF; --blue-soft:#E4EBFB;
  --ok:#1B7A4C; --ok-soft:#DDF1E6; --warn:#A8361C; --warn-soft:#FBE6E0; --alerte:#8A1C1C;
  --f0b:#DCE6FF; --f0t:#1D3E9E; --f1b:#D5F0E0; --f1t:#15613C; --f2b:#FFE3C7; --f2t:#8A4300;
  --f3b:#EADFFB; --f3t:#5B2A9E; --f4b:#CFEFEF; --f4t:#0B5959; --f5b:#FDDCDC; --f5t:#951B1B;
  --f6b:#FFF0B3; --f6t:#665000; --f7b:#FADAEE; --f7t:#86195C; --f8b:#E4EBC8; --f8t:#465410; --f9b:#E0E5EE; --f9t:#36415A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1525; --surface:#162038; --ink:#E7ECF6; --muted:#A1ACC3;
    --line:#2B395A; --rule:#22304E; --blue:#8EA7F2; --blue-ink:#0E1525; --blue-soft:#1D2B51;
    --ok:#6FD09C; --ok-soft:#153526; --warn:#F2917A; --warn-soft:#3D1E17; --alerte:#B3261E;
    --f0b:#20305E; --f0t:#BCCBFF; --f1b:#173D2A; --f1t:#A6E6C2; --f2b:#4A2E12; --f2t:#FFCB94;
    --f3b:#35245A; --f3t:#D9C4FA; --f4b:#113E3E; --f4t:#9EE3E3; --f5b:#4B1D1D; --f5t:#FFB8B8;
    --f6b:#473C0A; --f6t:#F5E08A; --f7b:#4A1B37; --f7t:#F5B5DB; --f8b:#343D12; --f8t:#D2E08F; --f9b:#2B3446; --f9t:#CBD3E3;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1525; --surface:#162038; --ink:#E7ECF6; --muted:#A1ACC3;
  --line:#2B395A; --rule:#22304E; --blue:#8EA7F2; --blue-ink:#0E1525; --blue-soft:#1D2B51;
  --ok:#6FD09C; --ok-soft:#153526; --warn:#F2917A; --warn-soft:#3D1E17; --alerte:#B3261E;
  --f0b:#20305E; --f0t:#BCCBFF; --f1b:#173D2A; --f1t:#A6E6C2; --f2b:#4A2E12; --f2t:#FFCB94;
  --f3b:#35245A; --f3t:#D9C4FA; --f4b:#113E3E; --f4t:#9EE3E3; --f5b:#4B1D1D; --f5t:#FFB8B8;
  --f6b:#473C0A; --f6t:#F5E08A; --f7b:#4A1B37; --f7t:#F5B5DB; --f8b:#343D12; --f8t:#D2E08F; --f9b:#2B3446; --f9t:#CBD3E3;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:68rem;margin:0 auto;padding:0 1.25rem}

/* Bandeau */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:1rem 2rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:1.1rem;padding-bottom:1rem}
.brand{display:flex;gap:1rem;align-items:center}
.brand img{height:3.6rem;width:auto;max-width:9rem;object-fit:contain}
.brand h1{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;letter-spacing:-.02em}
.brand .ver{font-family:var(--body);font-size:.85rem;font-weight:700;color:var(--muted);letter-spacing:0;vertical-align:middle;margin-left:.3rem}
.brand p{margin:.15rem 0 0;color:var(--muted)}
.outils{display:flex;gap:.5rem;align-items:center}
.ico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer}
.ico svg{width:1.25rem;height:1.25rem}
.pastille{position:absolute;top:-.3rem;right:-.3rem;min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:999px;background:var(--warn);color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.alerte{background:var(--alerte);color:#fff;text-align:center;font-weight:700;padding:.55rem 1rem}
.alerte a{color:#fff}
.nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;gap:.25rem;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.75rem .9rem;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--blue)}
.nav .spacer{flex:1}
main{padding:1.5rem 0 3rem;flex:1}
.pied{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.88rem}
.pied .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-top:.8rem;padding-bottom:.8rem}

/* Contrôles */
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;width:100%}
textarea{min-height:9rem;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
textarea.court{min-height:4.5rem;font-family:var(--body);font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.5rem .9rem;cursor:pointer;font-weight:700;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--blue)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:.3rem .6rem;font-size:.9rem}
.btn.link{border:0;background:none;padding:.2rem .3rem;color:var(--blue);text-decoration:underline}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.9rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field>span{font-weight:700;font-size:.92rem}
.hint{color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem;margin-bottom:1.25rem}
.panel h2{font-size:1.3rem;margin-bottom:.8rem}
.callout{border-left:4px solid var(--blue);background:var(--blue-soft);padding:.8rem 1rem;border-radius:0 6px 6px 0;margin-bottom:1.25rem}
.callout.err{border-left-color:var(--warn);background:var(--warn-soft)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty p{margin:.3rem 0 1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:.45rem .9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;font-size:.85rem;margin:.15rem .25rem .15rem 0;background:var(--surface)}
button.tag{cursor:pointer}
button.tag:hover{border-color:var(--blue)}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.tag.miss{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.absente{border-style:dashed;color:var(--muted);background:none}
.etq{display:inline-block;font-size:.78rem;border-radius:4px;padding:0 .4rem;margin:.1rem .25rem .1rem 0;background:var(--blue-soft);color:var(--ink)}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:.1rem .5rem;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.statut{font-weight:700}.statut.ok{color:var(--ok)}.statut.ko{color:var(--warn)}
.retour{margin:.25rem 0 .1rem;color:var(--warn);font-weight:700}
.jour-titre{font-family:var(--display);font-size:1rem;margin:.65rem 0 0}
.slots>.jour-titre,.slots>.hint{grid-column:1/-1;margin:.2rem 0 -.2rem}
.lgn-creneau{white-space:nowrap}
.cal-col{align-self:start;display:flex;flex-direction:column;gap:.4rem}
.cal-col .cal{justify-self:stretch}
.jour-bloc{margin-bottom:.9rem}
.jour-bloc legend .btn{margin-left:.6rem}
/* Filières en couleur */
.fc{border:0;font-weight:700}
.fc0{background:var(--f0b);color:var(--f0t)}.fc1{background:var(--f1b);color:var(--f1t)}.fc2{background:var(--f2b);color:var(--f2t)}
.fc3{background:var(--f3b);color:var(--f3t)}.fc4{background:var(--f4b);color:var(--f4t)}.fc5{background:var(--f5b);color:var(--f5t)}
.fc6{background:var(--f6b);color:var(--f6t)}.fc7{background:var(--f7b);color:var(--f7t)}.fc8{background:var(--f8b);color:var(--f8t)}.fc9{background:var(--f9b);color:var(--f9t)}

/* Carte forum : calendrier détachable + feuille d’émargement */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.forum{display:grid;grid-template-columns:5.2rem 1fr;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.95rem 1.05rem;margin-bottom:.8rem;font-size:.93rem;line-height:1.4}
.forum.passe{opacity:.72}
.forum .badge{font-size:.76rem;padding:.06rem .45rem}
.forum .retour{margin:.15rem 0 .25rem;font-size:.9rem}
.forum .tag{font-size:.8rem;padding:0 .55rem}
.forum .row .btn.small{padding:.25rem .55rem;font-size:.85rem}
.forum-h{gap:.6rem}
.cal{border:2px solid var(--ink);border-radius:6px;text-align:center;overflow:hidden;align-self:start;background:var(--surface)}
.cal .j{display:block;background:var(--ink);color:var(--paper);font-size:.74rem;font-weight:700;padding:.15rem 0}
.cal .n{display:block;font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;padding-top:.2rem}
.cal .m{display:block;font-size:.8rem;padding-bottom:.28rem}
.forum-h{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.forum-h h2{font-size:1.25rem;font-weight:700}
.lieu{margin:.12rem 0 .32rem;color:var(--muted)}
.forum-note{margin:.18rem 0 .45rem;font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.75rem;margin-top:.7rem}
.slot{border:1px solid var(--line);border-radius:7px;padding:.6rem .75rem;display:flex;flex-direction:column;font-size:.9rem}
.slot-h{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.slot-h strong{font-family:var(--display);font-size:.95rem}
.slot-h .plage{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:.85rem}
.slot-h{flex-wrap:nowrap}.slot-h strong,.slot-h .compte{white-space:nowrap}
.slot-h .compte{margin-left:auto;font-weight:700;font-size:.86rem}
.slot-h .compte.complet{color:var(--ok)}
.sheet{list-style:none;margin:.4rem 0 .55rem;padding:0;flex:1}
.sheet li{display:flex;align-items:flex-start;gap:.3rem;border-bottom:1px solid var(--rule);padding:.17rem .1rem;min-height:1.5rem;font-size:.9rem}
.sheet li .n{flex:1}
.sheet li .n .tag{font-size:.7rem;padding:0 .5rem;margin:0 0 0 .3rem}
.sheet .com{display:block;font-size:.8rem;color:var(--muted);font-style:italic}
.sheet .elv{display:block;font-size:.8rem;color:var(--muted)}
.sheet li.libre{color:var(--muted);font-style:italic}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:.12rem .28rem;border-radius:4px}
.x:hover{color:var(--warn);background:var(--warn-soft)}
.slot-a{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem}
.slot-a select{font-size:.9rem;padding:.3rem .45rem}
.slot-a .note{margin:0;color:var(--muted);font-size:.86rem}
.valeur{font-size:.82rem;color:var(--muted)}

/* Tableaux */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.zero td{color:var(--muted)}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.8rem;margin:0 0 1rem}
.chiffres div{border-left:3px solid var(--blue);padding:.2rem .8rem}
.chiffres dt{color:var(--muted);font-size:.9rem}
.chiffres dd{margin:0;font-family:var(--display);font-weight:700;font-size:1.5rem}
.barre{display:inline-block;height:.55rem;background:var(--blue);border-radius:2px;vertical-align:middle;margin-right:.4rem}
.infos{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
.infos dt{color:var(--muted)}.infos dd{margin:0;overflow-wrap:anywhere}
.adresse{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;font-weight:700;background:var(--blue-soft);padding:.35rem .6rem;border-radius:6px;display:inline-block;margin:.15rem 0}
.etiq-ligne{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid var(--rule)}
.etiq-ligne .check{font-weight:400;font-size:.92rem;white-space:nowrap}
.logo-apercu{max-height:5rem;max-width:12rem;border:1px solid var(--line);border-radius:6px;padding:.3rem;background:#fff}
.mention{color:var(--muted);font-size:.9rem;margin:.8rem 0 0}

/* Dialogue et notification */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(42rem,calc(100% - 2rem));max-height:calc(100% - 2rem)}
dialog::backdrop{background:rgba(10,18,35,.55)}
dialog form{padding:1.4rem;display:flex;flex-direction:column;gap:.9rem}
dialog h2{font-size:1.35rem}
.dlg-a{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.4rem}
fieldset{border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem;margin:0}
legend{font-weight:700;padding:0 .3rem}
.check{display:flex;gap:.5rem;align-items:center;font-weight:700}
.choix{display:flex;flex-direction:column;gap:.4rem}
.choix label{display:flex;gap:.5rem;align-items:center;padding:.4rem .6rem;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.puces{display:flex;flex-wrap:wrap;gap:.4rem}
.puce{display:inline-flex;gap:.4rem;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-size:.92rem}
.puce:has(input:checked){border-color:var(--blue);background:var(--blue-soft);font-weight:700}
.eleve{display:grid;grid-template-columns:1fr 1fr 6rem auto;gap:.4rem;margin-bottom:.4rem}
.erreur{color:var(--warn);font-weight:700;margin:0}
.nouveaute{border-left:3px solid var(--line);padding:.2rem 0 .2rem .9rem;margin-bottom:1rem}
.nouveaute h3{font-size:1.1rem}
.nouveaute ul{margin:.3rem 0 0;padding-left:1.1rem}
.type{display:inline-block;font-size:.78rem;font-weight:700;border-radius:4px;padding:.05rem .45rem;margin-left:.4rem;vertical-align:middle}
.type.correction{background:var(--f1b);color:var(--f1t)}.type.fonction{background:var(--f0b);color:var(--f0t)}.type.majeur{background:var(--f5b);color:var(--f5t)}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:8px;font-weight:700;max-width:calc(100% - 2rem);display:none;z-index:10}
#toast.on{display:block}
#toast.err{background:var(--warn);color:#fff}
.chargement{text-align:center;color:var(--muted);padding:4rem 1rem}

@media (max-width:560px){
  .forum{grid-template-columns:1fr}
  .cal{display:flex;align-items:center;gap:.6rem;border-width:1px;justify-self:start;padding-right:.7rem}
  .cal .j{padding:.3rem .6rem}.cal .n{font-size:1.5rem;padding:0}.cal .m{padding:0}
  .eleve{grid-template-columns:1fr 1fr}
  .brand img{height:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4;margin:9mm 9mm 10mm}
  .outils,.nav,.no-print,.slot-a,.x,#toast,main .callout,.cal-col{display:none!important}
  html,body{background:#fff;color:#000;font-size:9pt;line-height:1.25;min-height:0}
  :root{padding:0}
  .wrap{max-width:none;padding:0}
  .top .wrap{padding:0 0 2mm}.brand img{height:9mm}.brand h1{font-size:13pt}.brand p{font-size:8pt;margin:0}
  .top,.pied{border-color:#999}.pied{font-size:7pt}.pied .wrap{padding:1mm 0 0}
  main{padding:2mm 0 0}
  .forum{display:block;padding:1.6mm 2.4mm;margin:0 0 1.8mm;border-radius:2px;border-color:#999;font-size:8.5pt;opacity:1!important;break-inside:auto}
  .forum-h h2{font-size:10.5pt}
  .lieu,.forum-note,.forum .retour{margin:0;font-size:8pt}
  .forum .tag{font-size:7pt;margin:0 .2em 0 0;border:1px solid #999}
  .jour-titre,.slots>.jour-titre{font-size:8.5pt;margin:.6mm 0 0;break-after:avoid}
  .forum-h{break-after:avoid}
  .slots{grid-template-columns:repeat(4,1fr);gap:1.5mm;margin-top:1mm}
  .slot{padding:1mm 1.6mm;border-radius:2px;border-color:#aaa;font-size:8pt;break-inside:avoid}
  .slot-h strong{font-size:8.5pt}.slot-h .compte{font-size:8pt}
  .sheet{margin:.5mm 0 0}
  .sheet li{min-height:0;padding:.2mm 0;font-size:8pt;border-color:#ddd}
  .sheet li.libre{display:none}
  .sheet li.libre:first-child{display:flex}
  .sheet .com,.sheet .elv,.etq{font-size:7pt}
  .panel{break-inside:avoid;border-color:#999;padding:3mm;margin-bottom:3mm}
  table{font-size:8pt}th,td{padding:.6mm 1.2mm}
  .alerte{padding:1mm;font-size:8pt}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img id="logo" alt="" hidden>
    <div><h1><span id="appNom"></span><span class="ver" id="appVer"></span></h1><p id="sousTitre"></p></div></div>
  <div class="outils">
    <button type="button" class="ico" id="btnNews" data-action="nouveautes" aria-label="Quoi de neuf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="pastille" id="pastille" hidden></span></button>
    <button type="button" class="btn small" data-action="aide">Aide</button>
    <button type="button" class="btn small" data-action="apropos">À propos</button>
  </div>
</div></header>
<div class="alerte" id="alerteInteg" role="alert" hidden>Version modifiée – non conforme à l’original</div>
<nav class="nav" id="nav" aria-label="Navigation"></nav>
<main><div class="wrap" id="main"><p class="chargement">Chargement…</p></div></main>
<footer class="pied"><div class="wrap" id="pied"></div></footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<h2 id="campagne">0. Démarrage rapide : déroulé d’une campagne</h2>
<p>Les étapes ci-dessous couvrent une année complète. Chaque étape renvoie à la partie détaillée du guide.</p>
<ol class="etapes check">
<li><strong>Rentrée</strong> : téléchargez une sauvegarde de l’année précédente, puis <em>Paramètres &gt; Vider forums et inscriptions</em> (3.9).</li>
<li><strong>Enseignants</strong> : importez la liste à jour, en mode « Remplacer la liste » pour retirer les départs (3.6).</li>
<li><strong>Établissement</strong> : vérifiez le nom, le logo et les étiquettes de commentaire (3.9).</li>
<li><strong>Forums</strong> : créez chaque forum avec ses journées, ses créneaux, l’effectif souhaité et une date limite de réponse ; « Dupliquer » reprend un forum de l’an passé (3.4).</li>
<li><strong>Communication</strong> : diffusez l’aide enseignant (bouton en haut de ce guide) et indiquez la date limite.</li>
<li><strong>Suivi</strong> : l’onglet Bilan montre les créneaux incomplets et les filières sans représentant (3.7). Complétez si besoin en inscrivant vous-même un enseignant.</li>
<li><strong>Clôture</strong> : après la date limite, « Clore les inscriptions » sur la carte du forum (3.2).</li>
<li><strong>Avant le départ</strong> : imprimez la fiche de participation du forum, avec la liste des élèves accompagnés (3.5).</li>
<li><strong>Juin</strong> : <em>Bilan &gt; Exporter pour les examens (CSV)</em> et importez le fichier dans l’application d’organisation des examens (3.7).</li>
<li><strong>Tout au long de l’année</strong> : téléchargez une sauvegarde chaque semaine de campagne (partie 4).</li>
</ol>
<h2 id="presentation">1. Présentation de l’édition autonome</h2>
<p>Forums-Mobilisation organise la présence des enseignants sur les forums d’orientation : l’administration crée les forums, chaque enseignant choisit son nom dans le créneau du matin ou de l’après-midi, et le bilan compte les demi-journées de chacun pour l’organisation des examens de juin.</p>
<p>L’édition autonome tient dans un seul fichier HTML qui s’ouvre dans un navigateur, sans installation ni serveur. Elle offre les mêmes fonctions que la version réseau : logo, filières en couleur, étiquettes de commentaire, élèves accompagnés, fiches de participation, bilan et exports.</p>
<div class="attention">Les données sont enregistrées <strong>dans le navigateur du poste</strong> où le fichier est ouvert. Un autre poste, un autre navigateur ou une navigation privée ne voient pas les mêmes données, même si le fichier est placé sur un lecteur réseau. Pour que les enseignants s’inscrivent depuis leurs propres postes, utilisez la version réseau.</div>
<h2 id="demarrer">2. Démarrer et conserver ses données</h2>
<ol class="etapes">
<li>Enregistrez le fichier <code>forum-mobilisation-v1_0_0-autonome.html</code> dans un dossier fixe du poste (par exemple Documents), puis double-cliquez dessus. Edge, Chrome ou Firefox récents conviennent.</li>
<li>Utilisez toujours le même navigateur et le même emplacement du fichier : le navigateur rattache les données à l’adresse du fichier.</li>
<li>Connectez-vous à l’administration (identifiant <code>admin</code>, mot de passe initial <code>Admin%2026</code>) et changez aussitôt ce mot de passe.</li>
<li>Si l’ancienne version autonome a déjà servi dans ce navigateur, ses données sont reprises automatiquement à la première ouverture. Sinon, restaurez sa sauvegarde (partie 4).</li>
</ol>
<div class="note">Ne videz pas les données de navigation (« cookies et données de sites ») du navigateur utilisé : cela effacerait les inscriptions. Téléchargez une sauvegarde régulièrement.</div>
<h2 id="utilisation">3. Utilisation détaillée, écran par écran</h2>

<h3>3.1 Bandeau principal</h3>
<p>Il affiche le logo de l’établissement, le nom du logiciel suivi de sa version (par exemple « Forums-Mobilisation V1.0.0 ») et trois commandes :</p>
<ul>
  <li><strong>Cloche « Quoi de neuf »</strong> : une pastille rouge indique le nombre de versions installées depuis votre dernière consultation. Un clic ouvre la liste des nouveautés, de la plus récente à la plus ancienne (date, type : correction, nouvelle fonction ou changement majeur, et description). La pastille disparaît ensuite sur ce poste.</li>
  <li><strong>Aide</strong> : ouvre l’aide adaptée à la personne connectée : cette aide complète dans l’administration, une aide courte illustrée pour les enseignants.</li>
  <li><strong>À propos</strong> : version, date, mention d’auteur et rappel de la licence.</li>
</ul>
<p>Le pied de chaque écran rappelle la mention d’auteur et la version.</p>

<h3>3.2 Inscriptions (tous les enseignants, sans mot de passe)</h3>
<p>Chaque forum apparaît sous forme de carte : calendrier à gauche, nom, date(s), lieu, filières à représenter (chacune avec sa couleur) et informations pratiques. Si l’administration a fixé une date limite de réponse, elle apparaît en rouge et en gras sous le nom du forum. En dessous, une feuille d’émargement par créneau ouvert (matin, après-midi) indique les horaires, le nombre d’inscrits et, si l’administration l’a fixé, le nombre d’enseignants souhaités avec les places libres. Un forum qui se déroule sur plusieurs journées affiche une feuille par journée : inscrivez-vous séparément sur chaque journée où vous viendrez.</p>
<p><strong>S’inscrire :</strong></p>
<ol class="etapes">
  <li>Dans le créneau voulu, ouvrez la liste « M’inscrire… » et sélectionnez votre nom.</li>
  <li>Si le forum compte plusieurs filières, choisissez celle que vous représentez.</li>
  <li>Cochez les étiquettes utiles (« J’emmène des élèves », « Je viens par mes propres moyens »…).</li>
  <li>Si vous cochez « J’emmène des élèves », des lignes apparaissent : saisissez le nom, le prénom et la classe de chaque élève. « Ajouter un élève » ajoute une ligne, la croix en retire une.</li>
  <li>Ajoutez au besoin un commentaire libre, puis « M’inscrire ».</li>
</ol>
<p><strong>Règle de la demi-journée :</strong> un enseignant ne peut être inscrit que sur un seul forum par demi-journée. Dans la liste des noms, un collègue déjà pris ailleurs le même matin ou le même après-midi apparaît grisé, avec le nom de l’autre forum. L’application applique aussi ce contrôle à l’enregistrement.</p>
<p><strong>Modifier ou se retirer :</strong> le crayon ✎ à côté d’un nom rouvre l’inscription (filière, étiquettes, élèves, commentaire) ; la croix × la retire après confirmation. Quand l’administration a clos les inscriptions d’un forum, ces commandes disparaissent pour les enseignants.</p>
<p>Dans l’édition autonome, les inscriptions sont enregistrées dans le navigateur du poste utilisé : tous les enseignants doivent donc s’inscrire sur ce même poste. Le filtre « À venir / Tous » masque ou affiche les forums passés.</p>
<p><strong>Imprimer la liste</strong> (réservé à l’administration) imprime les forums affichés dans une mise en page resserrée : 4 créneaux par ligne, calendrier et bandeau d’explication masqués, lignes « Place libre » remplacées par le compteur. Choisissez « À venir » ou « Tous » avant d’imprimer.</p>
<p>Une fois connecté, chaque carte affiche en plus les boutons de gestion du forum :</p>
<figure><img src="{{IMG:adm0}}" alt="Carte d’un forum vue par l’administration, avec les boutons Modifier, Fiche de participation et Clore les inscriptions."><ol class="legende"><li><b class="n">1</b><span><strong>Modifier</strong> ouvre la fiche du forum ; <strong>Fiche de participation</strong> ouvre la fiche imprimable (3.5) ; <strong>Clore les inscriptions</strong> fige la liste, et le même bouton devient « Rouvrir les inscriptions ».</span></li></ol></figure>
<p>L’aide destinée aux enseignants, avec ses captures d’écran, s’ouvre avec le bouton « Ouvrir l’aide enseignant » en haut de ce guide : imprimez-la ou enregistrez-la en PDF pour la diffuser.</p>

<h3>3.3 Connexion à l’administration</h3>
<p>Bouton « Administration » à droite de la barre d’onglets. Identifiant <code>admin</code> pour l’administrateur, ou l’identifiant d’un collaborateur. Mot de passe initial de l’administrateur : <code>Admin%2026</code>, à changer immédiatement. « Se déconnecter » ferme la session ; elle se ferme aussi à la fermeture du navigateur.</p>
<table>
  <tr><th>Fonction</th><th>Administrateur</th><th>Collaborateur</th></tr>
  <tr><td>Forums, enseignants, bilan, fiches</td><td>Oui</td><td>Oui</td></tr>
  <tr><td>Paramètres : établissement, logo, étiquettes, sauvegarde</td><td>Oui</td><td>Oui</td></tr>
  <tr><td>Changer son propre mot de passe</td><td>Oui (onglet Collaborateurs)</td><td>Oui (onglet Paramètres)</td></tr>
  <tr><td>Gérer les collaborateurs</td><td>Oui</td><td>Non</td></tr>
  <tr><td>Restaurer, reprendre, vider ou effacer les données</td><td>Oui</td><td>Non</td></tr>
</table>
<p>Une fois connecté, l’administration peut inscrire n’importe quel enseignant et modifier ou retirer toute inscription. Sur un forum clos, plus personne ne peut inscrire, modifier ou retirer : rouvrez les inscriptions le temps de la correction, puis clôturez à nouveau.</p>

<h3>3.4 Forums</h3>
<p>L’onglet Forums liste tous les forums, passés compris, avec leurs créneaux et le nombre d’inscrits.</p>
<figure><img src="{{IMG:adm1}}" alt="Onglet Forums : barre d’onglets de l’administration, boutons Toutes les fiches de participation et Ajouter un forum, tableau des forums."><ol class="legende"><li><b class="n">1</b><span><strong>Onglets de l’administration</strong> : Inscriptions, Forums, Enseignants, Bilan, Collaborateurs (administrateur) et Paramètres ; « Se déconnecter » à droite.</span></li><li><b class="n">2</b><span><strong>Ajouter un forum</strong> ouvre une fiche vierge.</span></li><li><b class="n">3</b><span><strong>Toutes les fiches de participation</strong> : une page par forum, à imprimer en une fois.</span></li><li><b class="n">4</b><span><strong>Actions sur un forum</strong> : Modifier, Fiche, Dupliquer, Supprimer.</span></li></ol></figure>
<p>« Ajouter un forum » ou « Modifier » ouvre la fiche du forum :</p>
<figure><img src="{{IMG:adm2}}" alt="Fenêtre Modifier le forum : nom, date limite, lieu, filières, journées et créneaux."><ol class="legende"><li><b class="n">1</b><span><strong>Nom du forum</strong>, obligatoire.</span></li><li><b class="n">2</b><span><strong>Date limite de réponse</strong>, affichée en rouge sur la carte.</span></li><li><b class="n">3</b><span><strong>Filières</strong> : saisies au clavier, ou ajoutées en un clic parmi celles déjà utilisées.</span></li><li><b class="n">4</b><span><strong>Journée</strong> : date, puis pour chaque demi-journée la case à cocher d’ouverture, les horaires, l’effectif souhaité et la valeur en demi-journée.</span></li><li><b class="n">5</b><span><strong>Ajouter une journée</strong> pour un forum sur plusieurs jours.</span></li></ol></figure>
<table>
  <tr><th>Champ</th><th>Rôle</th></tr>
  <tr><td>Nom, lieu, date limite de réponse</td><td>Nom obligatoire. La date limite, facultative, s’affiche en rouge et en gras sur la carte du forum (« Réponse attendue avant le… »).</td></tr>
  <tr><td>Journées</td><td>Un forum peut se dérouler sur plusieurs journées : « Ajouter une journée » en crée une nouvelle, chacune avec sa propre date et ses propres créneaux.</td></tr>
  <tr><td>Filières à représenter</td><td>Séparées par des virgules. Les filières déjà utilisées sont proposées en un clic. Chaque filière reçoit une couleur fixe, reprise partout.</td></tr>
  <tr><td>Matin / Après-midi</td><td>Cochez, pour chaque journée, les créneaux ouverts. Horaires facultatifs, si la journée ne couvre pas toute la demi-journée. Un enseignant s’inscrit séparément sur chaque journée où il vient.</td></tr>
  <tr><td>Enseignants souhaités</td><td>Affiche des places libres sur la feuille d’émargement ; laissez vide pour ne pas fixer de limite.</td></tr>
  <tr><td>Valeur en demi-journée</td><td>1 par défaut. Mettez 0,5 pour un créneau court : c’est cette valeur qui est comptée dans le bilan.</td></tr>
  <tr><td>Informations</td><td>Texte affiché aux enseignants sur la carte du forum.</td></tr>
</table>
<p>Dans la liste des forums : « Modifier », « Fiche », « Dupliquer » (pour un forum qui revient chaque année) et « Supprimer » (supprime aussi ses inscriptions). Sur la carte d’un forum, « Clore les inscriptions » fige la liste ; « Rouvrir les inscriptions » la débloque.</p>

<h3>3.5 Fiche de participation</h3>
<p>Accessible depuis la carte d’un forum, la liste des forums, ou « Toutes les fiches de participation » (une page par forum). Elle s’ouvre dans un nouvel onglet, au format A4, avec le logo, le récapitulatif du forum, un tableau par créneau (enseignant, discipline, filière, précisions et nombre d’élèves), la liste des élèves accompagnés avec leur classe et leur accompagnateur, une synthèse et un emplacement pour le visa du chef d’établissement. « Imprimer ou enregistrer en PDF » lance l’impression. Si rien ne s’ouvre, autorisez les fenêtres surgissantes pour l’adresse de l’application.</p>

<h3>3.6 Enseignants</h3>
<figure><img src="{{IMG:adm4}}" alt="Cadre Importer la liste des enseignants avec la zone de données, le choix Ajouter ou Remplacer et le bouton Importer."><ol class="legende"><li><b class="n">1</b><span><strong>Données</strong> : collez ici l’export, ou utilisez « Choisir un fichier ».</span></li><li><b class="n">2</b><span><strong>Ajouter à la liste</strong> ou <strong>Remplacer la liste</strong>.</span></li><li><b class="n">3</b><span><strong>Importer</strong> lance l’import ; un message indique le nombre d’enseignants ajoutés, mis à jour ou retirés.</span></li></ol></figure>
<ul>
  <li><strong>Importer</strong> : collez un export CSV (Pronote, EDT, tableur) ou choisissez un fichier. Les colonnes Nom, Prénom, Discipline ou Matière sont reconnues ; sans en-tête, l’ordre attendu est Nom ; Prénom ; Discipline ; une seule colonne « NOM Prénom » fonctionne aussi. « Ajouter à la liste » conserve les enseignants existants ; « Remplacer la liste » retire ceux qui ne figurent plus dans le fichier, avec leurs inscriptions.</li>
  <li><strong>Ajouter</strong> un enseignant à la main, <strong>Modifier</strong> ou <strong>Supprimer</strong> (ses inscriptions sont supprimées).</li>
</ul>

<h3>3.7 Bilan</h3>
<p>Chiffres clés (forums, créneaux, places pourvues, enseignants mobilisés, demi-journées, élèves accompagnés), tableau par enseignant (participations et total de demi-journées) et tableau par forum (inscrits, élèves, créneaux complets ou incomplets, filières représentées en couleur et filières sans représentant en pointillés).</p>
<figure><img src="{{IMG:adm3}}" alt="Onglet Bilan : boutons d’export, chiffres clés et tableau par enseignant."><ol class="legende"><li><b class="n">1</b><span><strong>Exporter pour les examens (CSV)</strong> : le fichier à importer dans l’organisation des examens de juin.</span></li><li><b class="n">2</b><span><strong>Chiffres clés</strong> de la campagne.</span></li><li><b class="n">3</b><span><strong>Par enseignant</strong> : participations et total de demi-journées ; la case « Afficher aussi les enseignants non mobilisés » complète la liste.</span></li></ol></figure>
<ul>
  <li><strong>Exporter pour les examens (CSV)</strong> : colonnes Nom ; Prénom ; Discipline ; Demi-journées ; Élèves accompagnés ; Détail, séparateur point-virgule, ouvrable dans un tableur et importable dans l’application d’organisation des examens.</li>
  <li><strong>Exporter (JSON)</strong> : même contenu, détaillé par participation.</li>
</ul>

<h3>3.8 Collaborateurs (administrateur)</h3>
<p>Créez un compte par personne (nom affiché, identifiant, mot de passe de 6 caractères minimum). « Nouveau mot de passe » réinitialise celui d’un collaborateur qui l’a oublié. Le cadre « Mot de passe administrateur » change celui du compte <code>admin</code> (8 caractères minimum).</p>

<h3>3.9 Paramètres</h3>
<ul>
  <li><strong>Mon mot de passe</strong> (collaborateur) : mot de passe actuel, nouveau, confirmation.</li>
  <li><strong>Établissement</strong> : nom affiché dans le bandeau et sur les fiches ; ajout, remplacement ou retrait du logo (réduit automatiquement).</li>
  <li><strong>Étiquettes de commentaire</strong> : liste proposée aux enseignants lors de l’inscription. Modifiez les libellés, réordonnez avec ↑, supprimez avec ×, ajoutez-en, puis « Enregistrer les étiquettes ». La case « demande la liste des élèves » déclenche la saisie des élèves accompagnés.</li>
  <li><strong>Édition autonome</strong> : version de l’application et du schéma de données, état du stockage du navigateur, contrôle du fichier et journal des événements.</li>
  <li><strong>Sauvegarde et reprise des données</strong> : voir la partie 4.</li>
  <li><strong>Réinitialisation</strong> (administrateur) : « Vider forums et inscriptions » pour une nouvelle année ; « Tout effacer » remet l’application à zéro, mot de passe administrateur compris.</li>
</ul>

<h3>3.10 Contrôle d’intégrité</h3>
<p>À chaque ouverture, l’application vérifie la présence de la mention d’auteur dans l’en-tête et dans chaque bloc de code du fichier. En cas d’écart, le bandeau « Version modifiée – non conforme à l’original » s’affiche sur tous les écrans, sans bloquer l’utilisation, l’événement est inscrit au journal et Paramètres indique les éléments concernés ; sinon Paramètres affiche « Intégrité : OK ». Reprenez le fichier d’origine pour rétablir la conformité.</p>


<h2 id="sauvegarde">4. Sauvegarde, restauration et passage à la version réseau</h2>
<p><strong>Paramètres &gt; Télécharger la sauvegarde</strong> enregistre toutes les données dans un fichier JSON. <strong>Restaurer ou reprendre des données</strong> (administrateur) recharge une sauvegarde de l’édition autonome, de la version réseau ou de l’ancienne version autonome, et remplace les données actuelles.</p>
<p><strong>Passer à la version réseau :</strong> téléchargez la sauvegarde ici, installez la version réseau sur le serveur, puis dans la version réseau utilisez <strong>Paramètres &gt; Restaurer ou reprendre des données</strong>. Forums, enseignants, inscriptions, élèves, étiquettes, logo, collaborateurs et mots de passe sont repris.</p>
<p><strong>Revenir de la version réseau :</strong> une sauvegarde de la version réseau se restaure aussi ici, mais les mots de passe créés sur le serveur ne peuvent pas être relus par le navigateur : le mot de passe administrateur actuel est conservé et les collaborateurs concernés sont à recréer.</p>
<p><strong>Mise à jour :</strong> remplacez le fichier HTML par la nouvelle version, au même emplacement ; les données restent dans le navigateur et la pastille de la cloche signale les nouveautés.</p>

<h2 id="faq">5. Questions fréquentes et dépannage</h2>
<details open><summary>Un enseignant ne trouve pas son nom.</summary><p>Vérifiez l’onglet Enseignants : ajoutez-le avec « Ajouter un enseignant » ou réimportez la liste. S’il est déjà inscrit ailleurs sur la même demi-journée, son nom apparaît grisé : c’est la règle d’une inscription par demi-journée.</p></details>
<details open><summary>Un enseignant doit être inscrit alors que le forum est clos.</summary><p>Une fois connecté, vous pouvez inscrire, modifier ou retirer n’importe quel enseignant, même sur un forum clos. Vous pouvez aussi rouvrir les inscriptions le temps d’une correction.</p></details>
<details open><summary>La fiche de participation ou le guide ne s’ouvre pas.</summary><p>Le navigateur bloque les fenêtres surgissantes : autorisez-les pour ce fichier (icône à droite de la barre d’adresse), puis recommencez.</p></details>
<details open><summary>Un collaborateur a oublié son mot de passe.</summary><p>Connecté en administrateur, onglet Collaborateurs, « Nouveau mot de passe » sur sa ligne.</p></details>
<details open><summary>J’ai oublié le mot de passe administrateur.</summary><p>Il n’existe pas de procédure de récupération : le mot de passe n’est conservé que sous forme chiffrée. Créez dès le départ un compte collaborateur de secours et conservez le mot de passe administrateur en lieu sûr.</p></details>
<details open><summary>Message « Enregistrement impossible : l’espace de stockage du navigateur est plein ».</summary><p>Retirez le logo ou remplacez-le par une image plus légère, puis téléchargez une sauvegarde et videz les forums des années passées.</p></details>
<details open><summary>Le bandeau rouge « Version modifiée – non conforme à l’original » apparaît.</summary><p>Le fichier a été modifié. L’utilisation n’est pas bloquée, mais reprenez le fichier d’origine : Paramètres indique les éléments concernés (3.10).</p></details>
<details open><summary>Les données ont disparu.</summary><p>Vérifiez que le fichier est ouvert depuis le même emplacement et avec le même navigateur qu’habituellement, et hors navigation privée. Sinon, restaurez la dernière sauvegarde (partie 4).</p></details>

<h2 id="bonnes">6. Bonnes pratiques</h2>
<ul>
<li>Fixez toujours une <strong>date limite de réponse</strong> et clôturez le forum dès qu’elle est passée : la liste imprimée et la fiche de participation restent ainsi stables.</li>
<li>Indiquez un <strong>effectif souhaité</strong> sur chaque créneau : les places libres et le Bilan montrent immédiatement ce qu’il manque.</li>
<li>Utilisez la <strong>valeur en demi-journée</strong> (0,5 par exemple) pour les créneaux courts, afin que le décompte des surveillances de juin reste juste.</li>
<li>Téléchargez une <strong>sauvegarde</strong> chaque semaine pendant la campagne et avant toute réinitialisation.</li>
<li>Confiez un <strong>compte collaborateur</strong> personnel à chaque personne qui aide à la saisie, plutôt que de partager le mot de passe administrateur.</li>
</ul>

<h2 id="bref">1. En bref</h2>
<p>Cette application recense les enseignants qui accompagnent les élèves sur les forums d’orientation. Chaque demi-journée de présence est comptée et reprise ensuite comme surveillance dans l’organisation des examens de juin.</p>
<div class="cartes">
<div><strong>Aucun mot de passe</strong>Choisissez simplement votre nom dans la liste du créneau qui vous intéresse.</div>
<div><strong>Une demi-journée, un forum</strong>Vous ne pouvez être inscrit·e qu’à un seul forum par matin ou par après-midi.</div>
<div><strong>Avant la date limite</strong>Répondez avant la date indiquée en rouge sur la carte du forum.</div>
</div>

<h2 id="carte">2. Lire la carte d’un forum</h2>
<p>Chaque forum apparaît sous forme de carte. Le calendrier à gauche rappelle la ou les dates ; en dessous du nom figurent les dates, le lieu, les filières à représenter et les informations pratiques données par la direction.</p>
<figure><img src="{{IMG:ens1}}" alt="Exemple de carte de forum : nom, date limite, journées, créneaux du matin et de l’après-midi avec les inscrits et la liste M’inscrire.">
<figcaption>Exemple d’écran : un forum sur deux journées.</figcaption>
<ol class="legende"><li><b class="n">1</b><span><strong>Date limite de réponse</strong> : inscrivez-vous avant cette date.</span></li><li><b class="n">2</b><span><strong>Journée</strong> : un forum peut durer plusieurs jours ; chaque journée a ses propres créneaux.</span></li><li><b class="n">3</b><span><strong>Compteur</strong> : nombre d’inscrits sur le nombre d’enseignants souhaités. Il passe en vert quand le créneau est complet ; les lignes « Place libre » montrent ce qu’il manque.</span></li><li><b class="n">4</b><span><strong>Liste « M’inscrire… »</strong> : c’est ici que vous choisissez votre nom.</span></li><li><b class="n">5</b><span><strong>Crayon ✎ et croix ×</strong> : à côté de chaque nom, pour modifier ou retirer une inscription.</span></li></ol></figure>

<h2 id="inscrire">3. S’inscrire</h2>
<ol class="etapes">
<li>Repérez le forum et la journée qui vous intéressent, puis le créneau : <strong>Matin</strong> ou <strong>Après-midi</strong>.</li>
<li>Ouvrez la liste <strong>« M’inscrire… »</strong> de ce créneau et cliquez sur votre nom (les noms sont classés par ordre alphabétique).</li>
<li>La fenêtre « Confirmer l’inscription » s’ouvre : complétez-la comme ci-dessous.</li>
<li>Cliquez sur <strong>« M’inscrire »</strong>. Un message confirme l’inscription et votre nom apparaît sur la feuille du créneau.</li>
</ol>
<figure><img src="{{IMG:ens2}}" alt="Fenêtre Confirmer l’inscription avec la filière, les précisions, les élèves accompagnés et le commentaire.">
<figcaption>Exemple d’écran : la fenêtre de confirmation.</figcaption>
<ol class="legende"><li><b class="n">1</b><span><strong>Filière représentée</strong> : cochez celle que vous présenterez, ou « Plusieurs ou indifférent ». Cette rubrique n’apparaît que si le forum compte plusieurs filières.</span></li><li><b class="n">2</b><span><strong>Précisions</strong> : cochez ce qui vous concerne (élèves, transport, covoiturage, présence partielle…).</span></li><li><b class="n">3</b><span><strong>Élèves accompagnés</strong> : apparaît si vous cochez « J’emmène des élèves ». Saisissez le nom, le prénom et la classe de chaque élève ; « Ajouter un élève » ajoute une ligne, la croix en retire une.</span></li><li><b class="n">4</b><span><strong>Commentaire</strong> : facultatif, par exemple une heure d’arrivée ou un stand précis.</span></li><li><b class="n">5</b><span><strong>M’inscrire</strong> valide ; « Annuler » ferme la fenêtre sans rien enregistrer.</span></li></ol></figure>
<div class="note">Un forum sur plusieurs journées demande une inscription par journée : si vous venez les deux jours, inscrivez-vous sur chacune des deux journées.</div>

<h2 id="modifier">4. Modifier ou annuler son inscription</h2>
<ul>
<li><strong>Modifier</strong> : cliquez sur le crayon ✎ à droite de votre nom. La même fenêtre se rouvre : changez la filière, les précisions, les élèves ou le commentaire, puis enregistrez.</li>
<li><strong>Annuler</strong> : cliquez sur la croix × à droite de votre nom, puis confirmez.</li>
<li>Pour changer de créneau ou de forum, annulez l’inscription puis réinscrivez-vous au bon endroit.</li>
</ul>
<div class="attention">Ne modifiez ou ne retirez que <strong>votre propre</strong> inscription. En cas d’erreur sur le nom d’un collègue, prévenez la direction.</div>

<h2 id="regles">5. Les règles à connaître</h2>
<ul>
<li><strong>Une inscription par demi-journée.</strong> Si vous êtes déjà inscrit·e ailleurs le même matin ou le même après-midi, votre nom apparaît grisé dans la liste, suivi du nom de l’autre forum : il faut d’abord retirer l’autre inscription.</li>
<li><strong>Inscriptions closes.</strong> Quand la direction clôt un forum, le badge « Inscriptions closes » s’affiche, la liste « M’inscrire… » disparaît et les inscriptions ne peuvent plus être modifiées. Adressez-vous alors à la direction.</li>
